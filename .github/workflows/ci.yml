name: CI Pipeline & Quality Gate

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

jobs:
  test-and-build:
    name: Test & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Workspace Dependencies
        run: bun install

      - name: Run Test Suites
        run: bun run test

      - name: Build Monorepo & Static Assets
        run: bun run build

      - name: Verify Web SSG Build Artifacts
        run: |
          test -f apps/web/dist/index.html || (echo "apps/web/dist/index.html missing" && exit 1)
          test -f apps/web/dist/zendesk-sanitize-har-file/index.html || (echo "SafeHAR SEO pages missing" && exit 1)
          echo "All 13 static routes verified successfully!"

      - name: Verify Chrome Extension Artifacts
        run: |
          test -f apps/safehar-extension/manifest.json || (echo "manifest.json missing" && exit 1)
          test -f apps/safehar-extension/popup.html || (echo "popup.html missing" && exit 1)
          test -f apps/safehar-extension/popup.js || (echo "popup.js missing" && exit 1)
          echo "Chrome extension build artifacts verified successfully!"
